<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bıçakcı Ticaret | İşletme Yönetimi</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#16352b;font:15px system-ui}main{max-width:1100px;margin:auto;padding:16px}header,button{background:#16352b;color:white;border:0;border-radius:10px;padding:12px}header{padding:24px}h1{margin:8px 0}section,article{background:white;border-radius:12px;padding:16px;margin:12px 0}input,select,button{font:inherit;padding:11px;border-radius:8px}input,select{border:1px solid #aabbb2;width:100%;margin:5px 0}button{cursor:pointer;margin:3px}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{flex:1 0 125px}label{display:block;margin-top:8px}small{color:#53665d}header small{color:#cde4d8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{background:#e5efe9;padding:14px;border-radius:10px}.tile strong{display:block;font-size:22px}p{overflow-wrap:anywhere}[hidden]{display:none!important}#status{white-space:pre-wrap}details{margin:8px 0} .warn{color:#a32920}</style></head><body><main><header><small>BIÇAKCI TİCARET</small><h1>İşletme Yönetimi</h1></header><p id="status" role="status"></p><section id="login"><h2>Güvenli giriş</h2><form id="loginForm"><input name="email" type="email" required placeholder="E-posta" autocomplete="username"><input name="password" type="password" required placeholder="Şifre" autocomplete="current-password"><button>Giriş yap</button></form></section><div id="app" hidden><button id="logout">Çıkış yap</button><nav id="nav"></nav><section id="panel"></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://laguywodwugeljkxmjuj.supabase.co','sb_publishable_hePk5WCbQ2ktySNbRRsULg_3YR7ElRP',{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});const $=x=>document.getElementById(x), today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(new Date()), money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(x)||0), msg=x=>$('status').textContent=x;let uid,active='Ana sayfa',data={};const E=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};const add=(p,tag,t)=>{let e=E(tag,t);p.append(e);return e};const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);const tables=['customers','transactions','customer_balances','products','product_stock','suppliers','supplier_balances','stock_movements','supplier_transactions','cash_movements','sales','service_records','service_parts','payment_documents','business_orders','payment_reminders'];async function all(t){let a=[];for(let i=0;;i+=500){let {data,error}=await db.from(t).select('*').order('id').range(i,i+499);if(error)throw Error(t+': '+error.message);a.push(...data);if(data.length<500)return a}}async function load(){let r=await Promise.all(tables.map(all));data=Object.fromEntries(tables.map((t,i)=>[t,r[i]]))}async function insert(t,v){let {error}=await db.from(t).insert({...v,owner_id:uid});if(error)throw error}async function update(t,id,v){let {error}=await db.from(t).update(v).eq('id',id).eq('owner_id',uid);if(error)throw error}const methods=['Nakit','Kart','Havale','Veresiye'];const f=(key,label,type='text',required=false,opts=null)=>({key,label,type,required,opts});const n=(k,l,r=true)=>f(k,l,'number',r);const d=(k,l,r=true)=>f(k,l,'date',r);const s=(k,l,opts,r=true)=>f(k,l,'select',r,opts);const pick=(k,l,table,r=true)=>f(k,l,'lookup',r,table);function form(p,title,fields,save){add(p,'h3',title);let fm=add(p,'form');let readers={};for(let a of fields){let lab=add(fm,'label',a.label),i;if(a.type==='lookup'){i=add(lab,'input');i.placeholder='İsim / telefon / kod ara';let sel=add(lab,'select');sel.required=a.required;let fill=()=>{let old=sel.value;sel.replaceChildren(new Option('Seçiniz',''));for(let x of data[a.opts]||[]){let text=[x.name||x.customer_name,x.phone,x.product_code,x.barcode,x.service_no].filter(Boolean).join(' · ');if(text.toLocaleLowerCase('tr').includes(i.value.toLocaleLowerCase('tr')))sel.add(new Option(text,x.id))}if([...sel.options].some(o=>o.value===old))sel.value=old};i.oninput=fill;fill();readers[a.key]=()=>sel.value||null;continue}if(a.type==='select'){i=add(lab,'select');i.add(new Option('Seçiniz',''));for(let o of a.opts)i.add(new Option(o,o))}else{i=add(lab,'input');i.type=a.type;if(a.type==='date'&&a.required)i.value=today();if(a.type==='number'){i.min='0';i.step='0.01'}}i.required=a.required;readers[a.key]=()=>i.value.trim()||null}let b=add(fm,'button','Kaydet');fm.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await save(Object.fromEntries(Object.entries(readers).map(([k,v])=>[k,v()])));msg('Kayıt başarılı.');try{await load();render()}catch(e){msg('Kayıt yapıldı, liste yenilenemedi: '+e.message)}}catch(e){msg('İşlem başarısız: '+e.message)}finally{b.disabled=false}}}function list(p,rows,format){let search=add(p,'input');search.placeholder='Listede ara';let area=add(p,'div');let draw=()=>{area.replaceChildren();let q=search.value.toLocaleLowerCase('tr');for(let x of rows.filter(x=>JSON.stringify(x).toLocaleLowerCase('tr').includes(q))){let a=add(area,'article');format(a,x)}if(!area.children.length)add(area,'p','Kayıt bulunamadı.')} ;search.oninput=draw;draw()}const save=t=>v=>insert(t,v);function line(a,...v){add(a,'p',v.filter(x=>x!==null&&x!==undefined).join(' · '))}function render(){let p=$('panel');p.replaceChildren();add(p,'h2',active);let D=data;switch(active){case 'Ana sayfa':{let g=add(p,'div');g.className='grid';for(let [k,v] of [['Müşteri alacakları',sum(D.customer_balances,x=>Math.max(0,x.remaining_debt))],['Firma borçları',sum(D.supplier_balances,x=>Math.max(0,x.remaining_debt))],['Stok değeri (kayıtlı alış fiyatı)',sum(D.product_stock,x=>x.stock_value)],['Net para hareketi',sum(D.cash_movements,x=>x.type==='income'?x.amount:-x.amount)],['Bugünkü satış',sum(D.sales.filter(x=>x.sale_date===today()),x=>x.quantity*x.unit_price)],['Kayıtlı brüt satış kârı',sum(D.sales,x=>x.quantity*(x.unit_price-x.unit_cost))]]){let t=add(g,'div');t.className='tile';add(t,'small',k);add(t,'strong',money(v))}add(p,'p','Kritik stok: '+D.product_stock.filter(x=>x.low_stock).length);add(p,'p','Bekleyen vade: '+D.payment_reminders.filter(x=>!x.completed&&x.due_date<=today()).length);break}case 'Veresiye':form(p,'Yeni müşteri',[f('name','Ad soyad','text',true),f('phone','Telefon'),f('notes','Not')],save('customers'));form(p,'Borç / tahsilat',[pick('customer_id','Müşteri','customers'),s('type','İşlem',['debt','payment']),n('amount','Tutar'),d('transaction_date','Tarih'),s('payment_method','Ödeme türü',methods.slice(0,3),false),f('description','Açıklama')],save('transactions'));add(p,'h3','Müşteriler ve geçmiş');list(p,D.customer_balances,(a,x)=>{add(a,'strong',x.name);line(a,x.phone,'Bakiye: '+money(x.remaining_debt));let dt=add(a,'details');add(dt,'summary','İşlem geçmişi');let rows=D.transactions.filter(t=>t.customer_id===x.id).sort((a,b)=>a.transaction_date.localeCompare(b.transaction_date));let pay=sum(rows.filter(t=>t.type==='payment'),t=>t.amount),late=0,cut=new Date(today()+'T12:00:00Z');cut.setUTCFullYear(cut.getUTCFullYear()-2);for(let t of rows){line(dt,t.transaction_date,t.type==='debt'?'Borç':'Tahsilat',money(t.amount),t.description);if(t.type==='debt'){let used=Math.min(pay,Number(t.amount));pay-=used;if(t.transaction_date<cut.toISOString().slice(0,10))late+=Number(t.amount)-used}}if(late>0)line(a,'2 yılı geçmiş: '+money(late))});break;
case 'Stoklar':form(p,'Ürün ekle',[f('name','Ürün adı','text',true),f('barcode','Barkod'),f('product_code','Parça kodu'),f('brand','Marka'),f('model','Model'),f('category','Kategori'),f('shelf','Raf'),f('compatible_models','Uyumlu modeller'),n('purchase_price','Alış fiyatı'),n('sale_price','Satış fiyatı'),n('min_stock','Kritik stok'),f('unit','Birim')],save('products'));list(p,D.product_stock,(a,x)=>{add(a,'strong',x.name);line(a,x.brand,x.product_code,x.barcode,x.shelf,'Stok: '+x.current_stock,money(x.sale_price),x.low_stock?'KRİTİK STOK':'')});break;
case 'Gelen mallar':form(p,'Mal girişi',[pick('product_id','Ürün','products'),pick('supplier_id','Firma (açılış stoğunda boş)','suppliers',false),n('quantity','Adet'),n('unit_price','Birim alış fiyatı'),s('payment_method','Ödeme',methods,false),f('invoice_no','Fatura no'),d('transaction_date','Tarih'),f('description','Açıklama')],v=>insert('stock_movements',{...v,type:'in'}));list(p,D.stock_movements.filter(x=>x.type==='in'),(a,x)=>line(a,D.products.find(y=>y.id===x.product_id)?.name,x.quantity+' adet',money(x.unit_price),x.invoice_no,x.transaction_date));break;
case 'Satış':form(p,'Ürün satışı',[pick('product_id','Ürün','products'),pick('customer_id','Müşteri (veresiyede zorunlu)','customers',false),n('quantity','Adet'),n('unit_price','Birim satış fiyatı'),s('payment_method','Ödeme',methods),d('sale_date','Tarih'),f('description','Açıklama')],v=>{if(v.payment_method==='Veresiye'&&!v.customer_id)throw Error('Müşteri seçiniz');return insert('sales',{...v,unit_cost:D.products.find(x=>x.id===v.product_id).purchase_price})});list(p,D.sales,(a,x)=>line(a,D.products.find(y=>y.id===x.product_id)?.name,x.quantity+' adet',money(x.quantity*x.unit_price),x.payment_method,x.sale_date));break;
case 'Firmalar':form(p,'Firma ekle',[f('name','Firma adı','text',true),f('phone','Telefon'),f('address','Adres'),f('notes','Not')],save('suppliers'));form(p,'Firma borcu / ödeme',[pick('supplier_id','Firma','suppliers'),s('type','İşlem',['debt','payment']),n('amount','Tutar'),s('payment_method','Ödeme türü',methods.slice(0,3),false),d('due_date','Vade',false),d('transaction_date','Tarih'),f('description','Açıklama')],save('supplier_transactions'));list(p,D.supplier_balances,(a,x)=>{add(a,'strong',x.name);line(a,x.phone,'Kalan borç: '+money(x.remaining_debt));let dt=add(a,'details');add(dt,'summary','Hesap hareketleri');for(let t of D.supplier_transactions.filter(t=>t.supplier_id===x.id))line(dt,t.transaction_date,t.type,money(t.amount),t.due_date)});break;
case 'Muhasebe':form(p,'Manuel gelir / gider (otomatik satış ve tahsilatları tekrar girmeyin)',[s('type','İşlem',['income','expense']),f('category','Kategori (kira, muhasebeci, elektrik vb.)','text',true),n('amount','Tutar'),s('payment_method','Ödeme türü',methods.slice(0,3)),d('transaction_date','Tarih'),f('description','Açıklama')],save('cash_movements'));list(p,D.cash_movements,(a,x)=>line(a,x.transaction_date,x.type==='income'?'Giriş':'Çıkış',x.category,money(x.amount),x.payment_method,x.description));break;
case 'Teknik servis':form(p,'Servis kaydı',[f('customer_name','Müşteri','text',true),f('phone','Telefon'),f('machine','Makine'),f('brand','Marka'),f('model','Model'),f('serial_number','Seri no'),f('fault','Arıza'),n('labor_cost','İşçilik'),d('received_date','Teslim alma'),d('estimated_delivery','Tahmini teslim',false),d('warranty_end','Garanti bitişi',false)],save('service_records'));form(p,'Serviste kullanılan parça',[pick('service_id','Servis','service_records'),pick('product_id','Ürün','products'),n('quantity','Adet'),n('unit_price','Birim parça ücreti')],save('service_parts'));list(p,D.service_records,(a,x)=>{add(a,'strong','#'+x.service_no+' '+x.customer_name);line(a,x.machine,x.fault,x.status,money(Number(x.parts_cost)+Number(x.labor_cost)));let sel=add(a,'select');for(let st of ['Bekliyor','Arıza tespiti','Parça bekleniyor','Tamirde','Teslime hazır','Teslim edildi'])sel.add(new Option(st,st));sel.value=x.status;let b=add(a,'button','Durumu güncelle');b.onclick=async()=>{b.disabled=true;try{await update('service_records',x.id,{status:sel.value});await load();render()}catch(e){msg(e.message)}finally{b.disabled=false}}});break;
case 'Çek ve senet':form(p,'Belge ekle',[s('document_type','Belge',['Cek','Senet']),s('direction','Yön',['Alinan','Verilen']),f('contact_name','Firma / müşteri','text',true),f('document_no','Belge no'),f('bank_name','Banka'),n('amount','Tutar'),d('due_date','Vade'),f('notes','Not')],save('payment_documents'));list(p,D.payment_documents,(a,x)=>line(a,x.document_type,x.direction,x.contact_name,money(x.amount),x.due_date,x.status));break;
case 'Siparişler':form(p,'Sipariş ekle',[s('order_type','Tür',['Musteri','Firma']),f('contact_name','Firma / müşteri','text',true),f('product_name','Ürün','text',true),f('product_code','Kod'),n('quantity','Adet'),n('unit_price','Birim fiyat'),d('expected_date','Beklenen tarih',false),f('notes','Not')],save('business_orders'));list(p,D.business_orders,(a,x)=>line(a,x.contact_name,x.product_name,x.quantity,x.expected_date,x.status));break;
case 'Ödemeler':form(p,'Vade hatırlatması',[f('title','Başlık','text',true),f('category','Kategori'),n('amount','Tutar'),d('due_date','Vade'),f('notes','Not')],save('payment_reminders'));list(p,D.payment_reminders,(a,x)=>{line(a,x.title,money(x.amount),x.due_date,x.completed?'Tamamlandı':'Bekliyor');if(!x.completed){let b=add(a,'button','Tamamlandı işaretle');b.onclick=async()=>{try{await update('payment_reminders',x.id,{completed:true});await load();render()}catch(e){msg(e.message)}}}});break;
case 'Rapor ve yedek':add(p,'p','Kayıtların JSON kopyasını indir. Bu dosya kişisel ve finansal bilgiler içerir; güvenli saklayın.');let b=add(p,'button','Verileri indir');b.onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=E('a');a.href=u;a.download='bicakci-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};break}}
for(let name of ['Ana sayfa','Veresiye','Stoklar','Gelen mallar','Satış','Firmalar','Muhasebe','Teknik servis','Çek ve senet','Siparişler','Ödemeler','Rapor ve yedek']){let b=add($('nav'),'button',name);b.onclick=()=>{active=name;render()}}$('loginForm').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let {data,error}=await db.auth.signInWithPassword({email:e.target.email.value,password:e.target.password.value});e.target.password.value='';if(error)throw error;uid=data.user.id;await load();$('login').hidden=true;$('app').hidden=false;render();msg('Giriş başarılı.')}catch(e){await db.auth.signOut();msg(e.message)}finally{b.disabled=false}};$('logout').onclick=async()=>{await db.auth.signOut();data={};uid=null;$('panel').replaceChildren();$('app').hidden=true;$('login').hidden=false;msg('Oturum kapatıldı.')};
</script></body></html>
