<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bıçakcı Ticaret | Veresiye</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f3;color:#16352b;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#16352b;color:white;padding:22px;border-radius:16px}section,article{background:white;padding:18px;border-radius:14px;margin:14px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b8c8c0;border-radius:8px;margin:5px 0;width:100%}button{background:#17634b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#56675e}.late{color:#b42318;font-weight:bold}h2{font-size:20px}p{overflow-wrap:anywhere}[hidden]{display:none!important}</style><main><header><small style="color:#cde4d8">BIÇAKCI TİCARET</small><h1>Veresiye Defteri</h1></header><p id="status" role="status"></p><section id="login"><h2>Güvenli giriş</h2><form id="loginForm"><input id="email" type="email" placeholder="E-posta" required autocomplete="username"><input id="password" type="password" placeholder="Şifre" required autocomplete="current-password"><button>Giriş yap</button></form></section><div id="app" hidden><button id="logout">Çıkış yap</button><section><h2>Toplam alacak</h2><h1 id="total"></h1><small>Eski borçlar için tahsilatlar en eski borca öncelikle mahsup edilir (FIFO).</small></section><section><h2>Müşteri ekle</h2><form id="customerForm"><input id="name" placeholder="Ad soyad" required><input id="phone" placeholder="Telefon (isteğe bağlı)"><button>Kaydet</button></form></section><section><h2>Borç / tahsilat ekle</h2><form id="txForm"><select id="customer" required></select><select id="type"><option value="debt">Borç</option><option value="payment">Tahsilat</option></select><input id="amount" type="number" min="0.01" step="0.01" max="999999999999.99" placeholder="Tutar (TL)" required><input id="date" type="date" required><input id="description" placeholder="Açıklama"><button>İşlemi kaydet</button></form></section><section><h2>Müşteriler</h2><input id="search" placeholder="Müşteri ara"><label><input style="width:auto" type="checkbox" id="old"> Yalnızca 2 yılı geçmiş açık borçlar</label><div id="list"></div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://laguywodwugeljkxmjuj.supabase.co','sb_publishable_hePk5WCbQ2ktySNbRRsULg_3YR7ElRP',{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);let customers=[],tx=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n/100);const cents=n=>Math.round(Number(n)*100);const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(new Date());$('date').value=today();function msg(s){$('status').textContent=s}function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function clear(){customers=[];tx=[];$('list').replaceChildren();$('customer').replaceChildren();$('total').textContent='';$('app').hidden=true;$('login').hidden=false}async function all(table){let a=[];for(let i=0;;i+=500){const {data,error}=await db.from(table).select('*').order('id').range(i,i+499);if(error)throw error;a.push(...data);if(data.length<500)return a}}async function load(){const [c,t]=await Promise.all([all('customers'),all('transactions')]);customers=c;tx=t;$('customer').replaceChildren(...c.map(x=>new Option(x.name,x.id)));render()}function render(){let cutoff=new Date(today()+'T12:00:00Z');cutoff.setUTCFullYear(cutoff.getUTCFullYear()-2);const limit=cutoff.toISOString().slice(0,10);let total=0;$('list').replaceChildren();for(const c of [...customers].sort((a,b)=>a.name.localeCompare(b.name,'tr'))){const rows=tx.filter(t=>t.customer_id===c.id).sort((a,b)=>a.transaction_date.localeCompare(b.transaction_date)||String(a.created_at).localeCompare(String(b.created_at)));let payments=rows.filter(t=>t.type==='payment').reduce((s,t)=>s+cents(t.amount),0),balance=-payments,late=0;for(const t of rows.filter(t=>t.type==='debt')){const n=cents(t.amount);balance+=n;const used=Math.min(payments,n);payments-=used;if(t.transaction_date<limit)late+=n-used}total+=Math.max(0,balance);if(!c.name.toLocaleLowerCase('tr').includes($('search').value.toLocaleLowerCase('tr'))||($('old').checked&&!late))continue;const a=el('article','');a.append(el('h3',c.name),el('p','Bakiye: '+money(balance)));if(late){const p=el('p','⚠ 2 yılı geçmiş: '+money(late));p.className='late';a.append(p)}const d=el('details','');d.append(el('summary','İşlem geçmişi'));for(const t of rows)d.append(el('p',t.transaction_date+' · '+(t.type==='debt'?'Borç':'Tahsilat')+' · '+money(cents(t.amount))+' · '+(t.description||'')));a.append(d);$('list').append(a)}$('total').textContent=money(total)}async function run(form,fn){const b=form.querySelector('button');b.disabled=true;try{await fn()}catch(e){msg('İşlem başarısız: '+(e.message||'Bağlantıyı kontrol edin.'))}finally{b.disabled=false}}$('loginForm').onsubmit=e=>{e.preventDefault();run(e.target,async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;try{await load();$('login').hidden=true;$('app').hidden=false;msg('Giriş başarılı.')}catch(e){await db.auth.signOut();clear();throw e}})};$('logout').onclick=async()=>{clear();await db.auth.signOut();msg('Oturum kapatıldı.')};$('customerForm').onsubmit=e=>{e.preventDefault();run(e.target,async()=>{const {error}=await db.from('customers').insert({name:$('name').value.trim(),phone:$('phone').value.trim()});if(error)throw error;e.target.reset();msg('Müşteri kaydedildi.');await load()})};$('txForm').onsubmit=e=>{e.preventDefault();run(e.target,async()=>{const {error}=await db.from('transactions').insert({customer_id:$('customer').value,type:$('type').value,amount:$('amount').value,transaction_date:$('date').value,description:$('description').value});if(error)throw error;$('amount').value='';$('description').value='';msg('İşlem kaydedildi.');await load()})};$('search').oninput=render;$('old').onchange=render;
</script></html>
